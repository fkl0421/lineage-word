<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盔甲神憶 - 神憶查詢系統</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <h1>神憶組合效果與價格追蹤系統</h1>
    
    <!-- 導覽列 -->
    <div class="tab-container">
        <a href="index.html" class="tab-button">⚔️ 武器神憶</a>
        <a href="armor.html" class="tab-button active">🛡️ 盔甲神憶</a>
        <a href="price.html" class="tab-button">📈 價格走勢與統計</a>
    </div>

    <!-- 3 欄式搜尋列 + 清除按鈕 -->
    <div class="search-container">
        <div class="search-grid">
            <input type="text" id="armorSearchName" class="search-box" placeholder="搜尋神憶名稱（如：神暮）..." onkeyup="window.ArmorModule.filterTable()">
            <input type="text" id="armorSearchRune" class="search-box" placeholder="搜尋神文文字（如：焱）..." onkeyup="window.ArmorModule.filterTable()">
            <input type="text" id="armorSearchEffect" class="search-box" placeholder="搜尋神文效果（如：傷害減免）..." onkeyup="window.ArmorModule.filterTable()">
            <button class="btn-clear" onclick="window.ArmorModule.clearSearch()">🧹 清除搜尋</button>
        </div>
    </div>

    <div class="counter" id="armorRecordCount">顯示筆數：0</div>
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th style="width: 18%;">神憶名稱</th>
                    <th style="width: 22%;">組合神文</th>
                    <th style="width: 18%;">組合估計總價</th>
                    <th style="width: 42%;">神文效果</th>
                </tr>
            </thead>
            <tbody id="armorTableBody">
                <tr><td colspan="4" class="no-result">資料載入中...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 使用 ES Module 載入專屬模組與初始化 -->
<script type="module">
    import { ArmorModule } from './js/armor.js';
    
    // 將模組掛載到 window，讓 HTML 的 onkeyup 與 onclick 可以順利呼叫
    window.ArmorModule = ArmorModule;

    // 頁面載入完成後執行查詢與繪製
    document.addEventListener('DOMContentLoaded', () => {
        ArmorModule.filterTable();
    });
</script>
</body>
</html>
